name: Ilgigom
options:
  bundleIdPrefix: com.tonyne
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Ilgigom:
    type: application
    platform: iOS
    sources:
      - path: Sources
    scheme:
      testTargets: []
      storeKitConfiguration: Ilgigom.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonyne.ilgigom
        PRODUCT_NAME: Ilgigom
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 일기곰
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "그날의 위치와 날씨를 일기에 함께 기록하기 위해 사용됩니다."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
